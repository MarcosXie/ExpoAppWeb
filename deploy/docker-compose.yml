services:
  expo-app:
    image: ghcr.io/marcosxie/expoappweb:latest
    container_name: expo-app
    restart: unless-stopped
    env_file:
      - /opt/expo-app/.env
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - flygates_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/swagger/v1/swagger.json"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  flygates_net:
    external: true
